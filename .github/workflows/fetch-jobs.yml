name: Fetch Google Job Alerts

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch job alerts
        run: |
          set -o pipefail
          python scripts/fetch_jobs.py 2>&1 | tee fetch.log

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Fetch run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo '```'
            tail -n 60 fetch.log 2>/dev/null || echo "(no log captured)"
            echo '```'
            echo ""
            echo "### data/jobs.json header"
            python -c "import json; d=json.load(open('data/jobs.json')); print('total_jobs:', d['total_jobs']); print('last_updated:', d['last_updated']); print('regions:', d['stats']['regions'])"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update job alerts data $(date -u +%Y-%m-%d-%H%M)"
            git push
          fi

  deploy:
    needs: fetch-jobs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest
        run: git pull origin main

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
