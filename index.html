<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exordiom - Job Alerts Dashboard</title>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface2: #232733;
            --border: #2e3345;
            --text: #e4e6f0;
            --text-dim: #8b8fa3;
            --accent: #6c5ce7;
            --accent-light: #a29bfe;
            --green: #00cec9;
            --orange: #fdcb6e;
            --red: #ff7675;
            --blue: #74b9ff;
            --india: #ff9ff3;
            --philippines: #48dbfb;
            --remote: #feca57;
            --radius: 10px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        a { color: var(--accent-light); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1a1d27 0%, #2d1f4e 100%);
            border-bottom: 1px solid var(--border);
            padding: 20px 32px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: white;
        }
        .logo h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
        }
        .logo span {
            font-size: 12px;
            color: var(--text-dim);
            display: block;
        }
        .last-updated {
            font-size: 13px;
            color: var(--text-dim);
            text-align: right;
        }
        .last-updated strong {
            color: var(--green);
        }

        /* Stats Bar */
        .stats-bar {
            max-width: 1400px;
            margin: 24px auto;
            padding: 0 32px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }
        .stat-number {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.2;
        }
        .stat-label {
            font-size: 13px;
            color: var(--text-dim);
            margin-top: 4px;
        }
        .stat-india .stat-number { color: var(--india); }
        .stat-phil .stat-number { color: var(--philippines); }
        .stat-remote .stat-number { color: var(--remote); }
        .stat-total .stat-number { color: var(--green); }
        .stat-companies .stat-number { color: var(--accent-light); }
        .stat-today .stat-number { color: var(--orange); }

        /* Main Content */
        .main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 32px 40px;
        }

        /* Controls */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
        }
        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus { border-color: var(--accent); }
        .search-box::before {
            content: "\1F50D";
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
        }
        .filter-btn {
            padding: 10px 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-dim);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .filter-btn:hover { border-color: var(--accent); color: var(--text); }
        .filter-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }
        .sort-select {
            padding: 10px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            outline: none;
        }

        /* Date Group */
        .date-group {
            margin-bottom: 32px;
        }
        .date-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .date-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
        }
        .date-badge {
            background: var(--accent);
            color: white;
            font-size: 12px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
        }
        .today-label {
            background: var(--green);
            color: #000;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        /* Job Cards */
        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 14px;
        }
        .job-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .job-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            box-shadow: 0 4px 20px rgba(108, 92, 231, 0.15);
        }
        .job-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }
        .job-company {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .job-source {
            font-size: 11px;
            color: var(--text-dim);
            background: var(--surface2);
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }
        .job-role {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.3;
        }
        .job-role a {
            color: var(--text);
            transition: color 0.2s;
        }
        .job-role a:hover { color: var(--accent-light); text-decoration: none; }
        .job-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .tag {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .tag-india {
            background: rgba(255, 159, 243, 0.15);
            color: var(--india);
        }
        .tag-philippines {
            background: rgba(72, 219, 251, 0.15);
            color: var(--philippines);
        }
        .tag-remote {
            background: rgba(254, 202, 87, 0.15);
            color: var(--remote);
        }
        .tag-unknown {
            background: rgba(139, 143, 163, 0.15);
            color: var(--text-dim);
        }
        .job-desc {
            font-size: 13px;
            color: var(--text-dim);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .job-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .job-date {
            font-size: 12px;
            color: var(--text-dim);
        }
        .apply-btn {
            font-size: 12px;
            font-weight: 600;
            padding: 6px 16px;
            background: var(--accent);
            color: white;
            border-radius: 6px;
            transition: background 0.2s;
            display: inline-block;
        }
        .apply-btn:hover {
            background: #5a4bd4;
            text-decoration: none;
        }

        /* Charts Section */
        .charts-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .chart-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }
        .chart-card h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-dim);
        }
        .bar-chart { display: flex; flex-direction: column; gap: 8px; }
        .bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .bar-label {
            width: 120px;
            font-size: 13px;
            color: var(--text);
            text-align: right;
            flex-shrink: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .bar-track {
            flex: 1;
            height: 24px;
            background: var(--surface2);
            border-radius: 4px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            padding-left: 8px;
            font-size: 11px;
            font-weight: 600;
            color: white;
            min-width: 30px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }
        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 8px;
            color: var(--text);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 768px) {
            .header { padding: 16px; }
            .stats-bar, .main { padding: 0 16px; }
            .stats-bar { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .stat-card { padding: 12px; }
            .stat-number { font-size: 24px; }
            .jobs-grid { grid-template-columns: 1fr; }
            .charts-section { grid-template-columns: 1fr; }
            .controls { flex-direction: column; }
            .search-box { min-width: 100%; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon">E</div>
                <div>
                    <h1>Exordiom Job Alerts</h1>
                    <span>India & Philippines Remote Hiring Dashboard</span>
                </div>
            </div>
            <div class="last-updated" id="lastUpdated">Loading...</div>
        </div>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar" id="statsBar">
        <div class="stat-card stat-total">
            <div class="stat-number" id="statTotal">-</div>
            <div class="stat-label">Total Jobs</div>
        </div>
        <div class="stat-card stat-today">
            <div class="stat-number" id="statToday">-</div>
            <div class="stat-label">Added Today</div>
        </div>
        <div class="stat-card stat-companies">
            <div class="stat-number" id="statCompanies">-</div>
            <div class="stat-label">Companies</div>
        </div>
        <div class="stat-card stat-india">
            <div class="stat-number" id="statIndia">-</div>
            <div class="stat-label">India</div>
        </div>
        <div class="stat-card stat-phil">
            <div class="stat-number" id="statPhil">-</div>
            <div class="stat-label">Philippines</div>
        </div>
        <div class="stat-card stat-remote">
            <div class="stat-number" id="statRemote">-</div>
            <div class="stat-label">Remote</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main">
        <!-- Charts Section -->
        <div class="charts-section" id="chartsSection">
            <div class="chart-card">
                <h3>Top Hiring Companies</h3>
                <div class="bar-chart" id="companyChart"></div>
            </div>
            <div class="chart-card">
                <h3>Roles Breakdown</h3>
                <div class="bar-chart" id="roleChart"></div>
            </div>
            <div class="chart-card">
                <h3>Job Sources</h3>
                <div class="bar-chart" id="sourceChart"></div>
            </div>
            <div class="chart-card">
                <h3>Jobs by Date</h3>
                <div class="bar-chart" id="dateChart"></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by company, role, or keyword..." />
            </div>
            <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">All</button>
            <button class="filter-btn" data-filter="India" onclick="setFilter('India', this)">India</button>
            <button class="filter-btn" data-filter="Philippines" onclick="setFilter('Philippines', this)">Philippines</button>
            <button class="filter-btn" data-filter="Remote" onclick="setFilter('Remote', this)">Remote</button>
            <select class="sort-select" id="sortSelect" onchange="renderJobs()">
                <option value="date-desc">Newest First</option>
                <option value="date-asc">Oldest First</option>
                <option value="company-asc">Company A-Z</option>
                <option value="company-desc">Company Z-A</option>
            </select>
        </div>

        <!-- Job Listings -->
        <div id="jobListings">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading job data...</p>
            </div>
        </div>
    </div>

    <script>
        let allJobs = [];
        let currentFilter = "all";
        let dashboardData = null;

        // Load data
        async function loadData() {
            try {
                const response = await fetch("data/jobs.json");
                if (!response.ok) throw new Error("No data file found");
                dashboardData = await response.json();
                allJobs = dashboardData.jobs || [];
                renderAll();
            } catch (e) {
                console.error("Error loading data:", e);
                document.getElementById("jobListings").innerHTML =
                    `<div class="empty-state">
                        <h3>No job data found</h3>
                        <p>Run <code>python scripts/fetch_jobs.py</code> to fetch jobs.</p>
                    </div>`;
            }
        }

        function renderAll() {
            renderStats();
            renderCharts();
            renderJobs();
            updateLastUpdated();
        }

        function updateLastUpdated() {
            const el = document.getElementById("lastUpdated");
            if (dashboardData && dashboardData.last_updated) {
                const d = new Date(dashboardData.last_updated);
                el.innerHTML = `Last updated: <strong>${d.toLocaleDateString("en-US", {
                    weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
                })}</strong><br>${dashboardData.total_jobs} jobs tracked`;
            }
        }

        function renderStats() {
            const today = new Date().toISOString().split("T")[0];
            const todayJobs = allJobs.filter(j => j.date === today).length;
            const companies = new Set(allJobs.map(j => j.company)).size;
            const indiaJobs = allJobs.filter(j => j.regions && j.regions.includes("India")).length;
            const philJobs = allJobs.filter(j => j.regions && j.regions.includes("Philippines")).length;
            const remoteJobs = allJobs.filter(j => j.regions && j.regions.includes("Remote")).length;

            document.getElementById("statTotal").textContent = allJobs.length;
            document.getElementById("statToday").textContent = todayJobs;
            document.getElementById("statCompanies").textContent = companies;
            document.getElementById("statIndia").textContent = indiaJobs;
            document.getElementById("statPhil").textContent = philJobs;
            document.getElementById("statRemote").textContent = remoteJobs;
        }

        function renderCharts() {
            // Company chart
            const companyCounts = {};
            allJobs.forEach(j => { companyCounts[j.company] = (companyCounts[j.company] || 0) + 1; });
            const topCompanies = Object.entries(companyCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 8);
            renderBarChart("companyChart", topCompanies, var_accent_light());

            // Role chart
            const roleCounts = {};
            allJobs.forEach(j => { roleCounts[j.role] = (roleCounts[j.role] || 0) + 1; });
            const topRoles = Object.entries(roleCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 8);
            renderBarChart("roleChart", topRoles, "#00cec9");

            // Source chart
            const sourceCounts = {};
            allJobs.forEach(j => { sourceCounts[j.source] = (sourceCounts[j.source] || 0) + 1; });
            const topSources = Object.entries(sourceCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 8);
            renderBarChart("sourceChart", topSources, "#fdcb6e");

            // Date chart
            const dateCounts = {};
            allJobs.forEach(j => { dateCounts[j.date] = (dateCounts[j.date] || 0) + 1; });
            const recentDates = Object.entries(dateCounts)
                .sort((a, b) => b[0].localeCompare(a[0]))
                .slice(0, 7)
                .reverse();
            renderBarChart("dateChart", recentDates.map(([d, c]) => {
                const dt = new Date(d + "T00:00:00");
                return [dt.toLocaleDateString("en-US", { month: "short", day: "numeric" }), c];
            }), "#74b9ff");
        }

        function var_accent_light() { return "#a29bfe"; }

        function renderBarChart(containerId, data, color) {
            const container = document.getElementById(containerId);
            if (!data.length) {
                container.innerHTML = '<div style="color:var(--text-dim);font-size:13px;">No data</div>';
                return;
            }
            const max = Math.max(...data.map(d => d[1]));
            container.innerHTML = data.map(([label, count]) => {
                const pct = max > 0 ? (count / max * 100) : 0;
                return `<div class="bar-row">
                    <div class="bar-label" title="${label}">${label}</div>
                    <div class="bar-track">
                        <div class="bar-fill" style="width:${pct}%;background:${color}">${count}</div>
                    </div>
                </div>`;
            }).join("");
        }

        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            renderJobs();
        }

        function getFilteredJobs() {
            const search = document.getElementById("searchInput").value.toLowerCase();
            return allJobs.filter(job => {
                // Region filter
                if (currentFilter !== "all") {
                    if (!job.regions || !job.regions.includes(currentFilter)) return false;
                }
                // Search filter
                if (search) {
                    const haystack = `${job.title} ${job.company} ${job.role} ${job.description} ${job.source}`.toLowerCase();
                    if (!haystack.includes(search)) return false;
                }
                return true;
            });
        }

        function sortJobs(jobs) {
            const sort = document.getElementById("sortSelect").value;
            const sorted = [...jobs];
            switch (sort) {
                case "date-desc": sorted.sort((a, b) => b.date.localeCompare(a.date)); break;
                case "date-asc": sorted.sort((a, b) => a.date.localeCompare(b.date)); break;
                case "company-asc": sorted.sort((a, b) => a.company.localeCompare(b.company)); break;
                case "company-desc": sorted.sort((a, b) => b.company.localeCompare(a.company)); break;
            }
            return sorted;
        }

        function renderJobs() {
            const container = document.getElementById("jobListings");
            const filtered = sortJobs(getFilteredJobs());

            if (!filtered.length) {
                container.innerHTML = `<div class="empty-state">
                    <h3>No jobs match your filters</h3>
                    <p>Try adjusting your search or filter criteria</p>
                </div>`;
                return;
            }

            // Group by date
            const groups = {};
            filtered.forEach(job => {
                if (!groups[job.date]) groups[job.date] = [];
                groups[job.date].push(job);
            });

            const today = new Date().toISOString().split("T")[0];
            const yesterday = new Date(Date.now() - 86400000).toISOString().split("T")[0];

            let html = "";
            for (const [date, jobs] of Object.entries(groups)) {
                const d = new Date(date + "T00:00:00");
                const dateStr = d.toLocaleDateString("en-US", {
                    weekday: "long", month: "long", day: "numeric", year: "numeric"
                });
                let label = "";
                if (date === today) label = `<span class="today-label">Today</span>`;
                else if (date === yesterday) label = `<span class="today-label" style="background:var(--orange);color:#000">Yesterday</span>`;

                html += `<div class="date-group">
                    <div class="date-header">
                        <h2>${dateStr}</h2>
                        <span class="date-badge">${jobs.length} job${jobs.length !== 1 ? "s" : ""}</span>
                        ${label}
                    </div>
                    <div class="jobs-grid">
                        ${jobs.map(renderJobCard).join("")}
                    </div>
                </div>`;
            }

            container.innerHTML = html;
        }

        function renderJobCard(job) {
            const tags = (job.regions || []).map(r => {
                const cls = r.toLowerCase() === "india" ? "tag-india" :
                            r.toLowerCase() === "philippines" ? "tag-philippines" :
                            r.toLowerCase() === "remote" ? "tag-remote" : "tag-unknown";
                return `<span class="tag ${cls}">${r}</span>`;
            }).join("");

            return `<div class="job-card">
                <div class="job-card-header">
                    <span class="job-company">${escHtml(job.company)}</span>
                    <span class="job-source">${escHtml(job.source)}</span>
                </div>
                <div class="job-role">
                    <a href="${escHtml(job.link)}" target="_blank" rel="noopener">${escHtml(job.title)}</a>
                </div>
                <div class="job-tags">${tags}</div>
                ${job.description ? `<div class="job-desc">${escHtml(job.description)}</div>` : ""}
                <div class="job-footer">
                    <span class="job-date">${escHtml(job.date)}</span>
                    <a class="apply-btn" href="${escHtml(job.link)}" target="_blank" rel="noopener">View Job</a>
                </div>
            </div>`;
        }

        function escHtml(str) {
            if (!str) return "";
            const div = document.createElement("div");
            div.textContent = str;
            return div.innerHTML;
        }

        // Search debounce
        let searchTimer;
        document.getElementById("searchInput").addEventListener("input", () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(renderJobs, 200);
        });

        // Init
        loadData();
    </script>
</body>
</html>
