# Google Job Alerts Dashboard Configuration
# ==========================================

# Google Alerts RSS Feed URLs
# To get these:
# 1. Go to https://www.google.com/alerts
# 2. Create your alert with the search strings below
# 3. In "Deliver to", select "RSS feed" instead of email
# 4. Copy the RSS feed URL and paste it here
rss_feeds:
  - name: "India Remote Tech Roles"
    url: ""  # Paste your Google Alerts RSS URL here
  - name: "Philippines Remote Tech Roles"
    url: ""  # Paste your Google Alerts RSS URL here

# Regions to target
regions:
  - "India"
  - "Philippines"
  - "Remote"

